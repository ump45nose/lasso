name: macOS acceptance build
run-name: ${{ inputs.delivery_id && format('Delivery {0}', inputs.delivery_id) || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      architectures:
        description: Package for acceptance (arm64) or all supported Macs
        type: choice
        options: [arm64, all]
        default: arm64
      source_sha:
        description: Exact committed source for this build
        type: string
      delivery_id:
        description: Delivery queue correlation ID
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.architectures == 'all' && '{"include":[{"runner":"macos-15","arch":"arm64"},{"runner":"macos-15-intel","arch":"x64"}]}' || '{"include":[{"runner":"macos-15","arch":"arm64"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag must match package.json version' >&2; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            outputs/.native-cache
            outputs/.electron-cache
          key: lasso-macos-${{ matrix.arch }}-${{ hashFiles('native/**', 'scripts/build-capture.mjs', 'package-lock.json') }}
          restore-keys: lasso-macos-${{ matrix.arch }}-
      - name: Build release app
        run: npm run package -- --release
      - name: Archive app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app="release/Lasso-darwin-${ARCH}/Lasso.app"
          name="Lasso-${VERSION}-macos-${ARCH}"
          codesign --verify --deep --strict "$app"
          mkdir -p outputs/release outputs/dmg
          ditto -c -k --sequesterRsrc --keepParent "$app" "outputs/release/$name.zip"
          ditto "$app" "outputs/dmg/Lasso.app"
          ln -s /Applications outputs/dmg/Applications
          for attempt in 1 2 3 4 5; do
            if dmg_output=$(hdiutil create -volname Lasso -srcfolder outputs/dmg -fs HFS+ -format UDZO -ov "outputs/release/$name.dmg" 2>&1); then
              printf '%s\n' "$dmg_output"
              break
            fi
            printf '%s\n' "$dmg_output" >&2
            if [[ "$dmg_output" != *"Resource busy"* || "$attempt" == 5 ]]; then
              exit 1
            fi
            sleep 5
          done
          cd outputs/release
          shasum -a 256 "$name.zip" "$name.dmg" > "$name.sha256"
      - name: Stage portable delivery
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          scripts/delivery.sh stage --app "$PWD/release/Lasso-darwin-${ARCH}/Lasso.app" --output "$PWD/outputs/portable"
          ditto -c -k --sequesterRsrc outputs/portable "outputs/release/Lasso-${VERSION}-delivery-${ARCH}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Delivery-${{ matrix.arch }}
          path: outputs/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
